name: Update TAMU Models

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_MERGE_PAT }}

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run update script
        env:
          TAMU_PRO_AI_KEY: ${{ secrets.TAMU_PRO_AI_KEY }}
          TAMU_AI_KEY: ${{ secrets.TAMU_AI_KEY }}
        run: scripts/update-tamu-models.sh

      - name: Commit and push changes
        run: |
          set -Eeu

          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No model changes, nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add modules/dev/opencode/tamu-models-pro.json modules/dev/opencode/tamu-models-base.json
          git commit -m "chore: update TAMU models"

          git push origin HEAD:master
